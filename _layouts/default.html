<!doctype html>
<html lang="en">
  {% include head.html %}
  <body>
    <div class="wrap">
      <header class="site-header">
        <div class="brand">
          <div class="logo"><img src="/assets/logo-new.svg" alt="Cornercase QA Labs logo"/></div>
          <div class="title">
            <h1><a href="/">Cornercase QA Labs</a></h1>
            <p class="tagline">Automation • Reporting • CI Integrations</p>
          </div>
        </div>
        <nav class="site-nav">
          <a href="/">Home</a>
          <a href="/services/">Services</a>
          <a href="/posts/">Updates</a>
          <a href="#contact">Contact</a>
        </nav>
      </header>

      <main class="site-main">
        {{ content }}
      </main>

      <footer class="site-footer">
        © Cornercase QA Labs — Professional QA & Testing services
      </footer>
    </div>

    <script>
      // lightweight lightbox for hero images
      (function(){
        const modal = document.createElement('div');
        modal.id = 'jl-modal';
        modal.style.cssText = 'position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,6,10,0.75);z-index:9999;padding:20px';
        const img = document.createElement('img'); img.style.maxWidth='100%'; img.style.maxHeight='90vh'; img.style.borderRadius='10px';
        const close = document.createElement('button'); close.textContent='Close'; close.style.cssText='position:absolute;right:18px;top:18px;padding:8px 10px;border-radius:6px;background:rgba(255,255,255,0.06);color:#fff;border:none;cursor:pointer';
        modal.appendChild(img); modal.appendChild(close); document.body.appendChild(modal);
        document.querySelectorAll('.hero-item').forEach(el=>{
          el.addEventListener('click',()=>{ img.src = el.getAttribute('data-src') || el.querySelector('img')?.src; modal.style.display='flex'; });
          el.addEventListener('keydown', (e)=>{ if(e.key==='Enter') el.click(); });
        });
        close.addEventListener('click',()=>{ modal.style.display='none'; img.src=''; });
        modal.addEventListener('click',(e)=>{ if(e.target===modal) { modal.style.display='none'; img.src=''; } });
        window.addEventListener('keydown',(e)=>{ if(e.key==='Escape' && modal.style.display==='flex') modal.style.display='none'; });
      })();
    </script>
  </body>
</html>
